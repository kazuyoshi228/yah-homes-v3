# S3（2026-08-25 発注者承認）: functions/ に触れる main への push で agencyApi を本番へ。
# tsc が通らなければ止まる。デプロイ元は常にコミット済みの main。
# 対象は yah.OS の agencyApi と定点の同期関数（seoserver 等は従来どおり手元から——対象を広げるときは承認を得る）。
# agencyDaily を追加（2026-08-27）: 点検メールの改修が agencyApi だけ配られ、
# メール送信側（スケジュール関数）が旧コードのまま動く事故が実際に起きた。
# 定点の同期を追加（2026-08-26 発注者承認）: スケジュール関数がCIの対象外で、
# 直すたびに手元デプロイ＋firebase認証が要った（当日、認証切れで実際に足止めされた）。
name: deploy-agency-api
on:
  push:
    branches: [main]
    paths: ["functions/**", ".github/workflows/deploy-functions.yml"]
concurrency:
  group: deploy-agency-api
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 依存を入れて型チェック
        working-directory: functions
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm test    # 金額計算のテスト（loanState・facts合計・期日判定）。落ちたらデプロイしない
          node derivecheck.mjs   # 導出値（NOI・DSCR・利回り・担保余力）が derive.ts の外で
                                 # 書き直されていないか。2026-09-02にNOIが4か所で食い違ったため
          node reportcheck.mjs   # 提案書テンプレートに金額が焼き込まれていないか。
                                 # 2026-09-03に30年後の清算額を1日で6回訂正したため
      - name: ビルドSHAを焼き込む（デプロイ後の照合用・QA②）
        working-directory: functions
        run: |
          echo "/* CIが生成（照合用） */" > src/agency/buildinfo.ts
          echo "export const BUILD = \"${GITHUB_SHA}\";" >> src/agency/buildinfo.ts
      - name: agencyApi と定点の同期をデプロイ
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SA" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npx firebase-tools deploy --project yah-homes --non-interactive --force \
            --only functions:agencyApi,functions:agencyDaily,functions:agencyGmailPush,functions:plantingCal,functions:exteriorCal,functions:kaitekiCal,functions:ga4TeitenSync,functions:adsTeitenSync,functions:gscSync,functions:bookingTeitenSync
      - name: デプロイ後の照合（本番が今回のビルドで動いているか・QA②）
        run: |
          DEPLOYED=$(curl -fsS "https://asia-northeast1-yah-homes.cloudfunctions.net/agencyApi?action=version" | python3 -c "import json,sys; print(json.load(sys.stdin)['build'])")
          echo "deployed=$DEPLOYED expected=$GITHUB_SHA"
          test "$DEPLOYED" = "$GITHUB_SHA"
